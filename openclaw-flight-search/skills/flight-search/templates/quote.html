<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Uma página: cabeçalho discreto, rota, três números-resumo e cartões do menor ao maior preço.
   Cada trecho é uma linha com barra proporcional ao tempo: voo (escuro) e conexão (claro). */
:root {
  --bg: #FFFFFF;
  --surface: #F5F5F7;
  --fg: #1D1D1F;
  --muted: #6E6E73;
  --hair: #D2D2D7;
  --flight: #1D1D1F;
  --wait: #C7C7CC;
  --accent: #0066CC;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 400 13px/1.45 var(--font);
  font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased;
  padding-block: 28px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 11.5px; }
.top .brand { color: var(--fg); font-weight: 600; font-size: 13px; letter-spacing: -.01em; }
.top .ref { display: flex; gap: 14px; flex-wrap: wrap; }

.hero { display: grid; gap: 4px; }
.hero h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
.hero h1 span { color: var(--muted); font-weight: 400; }
.hero .meta { color: var(--muted); font-size: 13px; }
.hero .client { margin: 2px 0 0; font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 12px; padding: 10px 14px; display: grid; gap: 1px; }
.stat span { font-size: 11px; color: var(--muted); }
.stat b { font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
.stat small { font-size: 11px; color: var(--muted); }

.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border-radius: 14px; padding: 12px 16px 10px; display: grid; gap: 4px; }
.card-head { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--hair); }
.rank { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.price { display: flex; align-items: baseline; gap: 8px; }
.price b { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
.price .per { font-size: 11.5px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.air { font-weight: 500; margin-right: 2px; }
.tag { white-space: nowrap; font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.tag.accent { background: var(--accent); color: var(--bg); }
.tag.dark { background: var(--fg); color: var(--bg); }
.gf { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 500; white-space: nowrap; }
.gf:hover { text-decoration: underline; }
.gf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.slice { display: grid; grid-template-columns: 74px minmax(0, 1fr) 78px; gap: 14px; align-items: start; padding: 6px 0 4px; }
.slice + .slice { border-top: 1px solid var(--hair); }
.slice.note { display: block; color: var(--muted); font-size: 12px; }
.when { display: grid; font-size: 11.5px; color: var(--muted); padding-top: 1px; }
.when b { color: var(--fg); font-weight: 600; font-size: 12px; }
.route-line { display: grid; gap: 4px; min-width: 0; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ends b { color: var(--fg); font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
.ends sup { font-size: 9.5px; color: var(--accent); font-weight: 600; }
.bar { display: flex; gap: 3px; }
.bar i { display: block; height: 5px; border-radius: 3px; flex-basis: 0; min-width: 6px; }
.bar .f { background: var(--flight); }
.bar .w { background: var(--wait); }
.legs { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11px; color: var(--muted); }
.legs b { color: var(--fg); font-weight: 600; }
.legs .lay b { color: var(--muted); font-weight: 600; }
.total { text-align: right; display: grid; font-size: 11.5px; color: var(--muted); padding-top: 1px; }
.total b { color: var(--fg); font-weight: 600; font-size: 13px; }

.foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 10.5px; line-height: 1.5; border-top: 1px solid var(--hair); padding-top: 10px; }
.foot p { margin: 0; max-width: 92ch; }
.foot .sig { white-space: nowrap; font-weight: 500; }

@media (max-width: 620px) {
  .hero h1 { font-size: 25px; }
  .slice { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
  .when { grid-column: 1; display: flex; gap: 6px; }
  .total { grid-column: 2; grid-row: 1; }
  .route-line { grid-column: 1 / -1; }
  .gf { margin-left: 0; }
  .who { flex-basis: 100%; }
}
@media print {
  @page { size: A4; margin: 9mm 10mm; }
  body { padding: 0; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { max-width: none; gap: 12px; }
  .hero h1 { font-size: 26px; }
  .stat { padding: 8px 12px; }
  .stat b { font-size: 17px; }
  .stats { gap: 8px; }
  .stat { padding: 6px 12px; }
  .cards { gap: 8px; }
  .card { padding: 8px 14px 5px; gap: 2px; }
  .card-head { padding-bottom: 4px; }
  .tag { font-size: 9.5px; padding: 1px 7px; }
  .slice { padding: 3px 0 2px; }
  .ends b { font-size: 13px; }
  .legs { font-size: 10.5px; }
  .foot { font-size: 9.5px; padding-top: 8px; }
  .card { break-inside: avoid; }
}
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <span class="brand">{{brand}}</span>
    <span class="ref"><span>Cotação {{reference}}</span><span>Emitida {{issued}}</span><span>Válida até {{valid_until}}</span></span>
  </div>

  <section class="hero">
    <h1>{{route_title}}</h1>
    <div class="meta">{{route_meta}}</div>
    {{client_line}}
  </section>

  <section class="stats">{{summary_html}}</section>

  <section class="cards">{{options_html}}</section>

  <footer class="foot">
    <p>{{footnote}}</p>
    <span class="sig">{{brand}} · OpenClaw</span>
  </footer>
</main>
</body>
</html>
